# YOLOv8n + 通用 GAM（在 P4、P5 的 C2f 之后各插入一个 GAM）
nc: 30  # 您的类别数
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0
  - [-1, 1, Conv, [128, 3, 2]]     # 1
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5
  - [-1, 6, C2f, [512, True]]      # 6
  # ========== 插入第一个 GAM（P4 层）==========
  - [-1, 1, Triplet_Attention, [512, 4]]  # 7
  # ===========================================
  - [-1, 1, Conv, [1024, 3, 2]]    # 8
  - [-1, 3, C2f, [1024, True]]     # 9
  # ========== 插入第二个 GAM（P5 层）==========
  - [-1, 1, Triplet_Attention, [1024, 4]] # 10
  # ===========================================
  - [-1, 1, SPPF, [1024, 5]]       # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 12
  - [[-1, 7], 1, Concat, [1]]                   # 13  ← 注意这里引用了索引 7（GAM 输出）
  - [-1, 3, C2f, [512]]                         # 14
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 15
  - [[-1, 4], 1, Concat, [1]]                   # 16
  - [-1, 3, C2f, [256]]                         # 17
  - [-1, 1, Conv, [256, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat, [1]]                  # 19
  - [-1, 3, C2f, [512]]                         # 20
  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 11], 1, Concat, [1]]                  # 22
  - [-1, 3, C2f, [1024]]                        # 23
  # Detect 层引用的三个特征图分别为：
  #   P3: 索引 17（C2f 256）
  #   P4: 索引 20（C2f 512）
  #   P5: 索引 23（C2f 1024）
  - [[17, 20, 23], 1, Detect, [nc]]             # 24